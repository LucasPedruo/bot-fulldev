services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fulldev:fulldev@postgres:5432/fulldev_bot}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - whatsapp_auth:/app/data/whatsapp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fulldev
      POSTGRES_PASSWORD: fulldev
      POSTGRES_DB: fulldev_bot
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulldev -d fulldev_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  whatsapp_auth:
